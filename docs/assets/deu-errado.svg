<svg xmlns="http://www.w3.org/2000/svg" width="860" height="492" viewBox="0 0 860 492" role="img" aria-label="Cases: O túnel caiu, 13 → 60 MB/s depois de trocar a VPN por SSH sobre TCP; Deploy com erro, 78 → 0 erros por deploy, com dreno de 20 s e duas réplicas; Uma letra, ã de &quot;São Paulo&quot; num cabeçalho derrubava o tempo real; IP não liberado, 403 na conferência antes do corte: chave restrita por IP">
<title>Cases: O túnel caiu, 13 → 60 MB/s depois de trocar a VPN por SSH sobre TCP; Deploy com erro, 78 → 0 erros por deploy, com dreno de 20 s e duas réplicas; Uma letra, ã de "São Paulo" num cabeçalho derrubava o tempo real; IP não liberado, 403 na conferência antes do corte: chave restrita por IP</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
