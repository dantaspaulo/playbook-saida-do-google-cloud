<line class="ln" x1="24" y1="196" x2="396" y2="196" stroke="#2A2723" pathLength="100" style="animation-delay:0.60s"/>
<g class="up" style="animation-delay:0.70s"><text class="cf" x="24" y="219">cabeçalho de localização apagado na borda</text></g></g><g transform="translate(440.0,256)"><rect x="1" y="1" width="418" height="234" rx="16" fill="#151310" stroke="#2A2723"/>
<clipPath id="cc3"><rect x="1" y="1" width="418" height="234" rx="16"/></clipPath>
