<line class="ln" x1="24" y1="196" x2="396" y2="196" stroke="#2A2723" pathLength="100" style="animation-delay:0.50s"/>
<g class="up" style="animation-delay:0.60s"><text class="cf" x="24" y="219">VMs ~3/4 da conta · banco gerenciado ~1/4</text></g></g><g transform="translate(440.0,0)"><rect x="1" y="1" width="418" height="234" rx="16" fill="#151310" stroke="#2A2723"/>
<clipPath id="cc1"><rect x="1" y="1" width="418" height="234" rx="16"/></clipPath>
<g clip-path="url(#cc1)"><g class="shine"><rect x="0" y="-20" width="150" height="276" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="418" height="234" rx="16" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<rect x="22" y="22" width="40" height="40" rx="11" fill="#1F1C18" stroke="#2A2723"/>
