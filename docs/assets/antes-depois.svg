<rect x="324.2" y="22" width="73.8" height="22" rx="11.0" fill="#1F1C18" stroke="#3A352E"/><text class="cp" x="361.1" y="37.0" text-anchor="middle">OUTUBRO</text>
<g class="up" style="animation-delay:0.35s"><text class="cn" x="22" y="138">~R$ 320</text></g>
<g class="up" style="animation-delay:0.60s"><text class="cl" x="24" y="166" text-anchor="start">por mês, com o servidor no</text><text class="cl" x="24" y="185" text-anchor="start">preço cheio de renovação</text></g>
<line class="ln" x1="24" y1="196" x2="396" y2="196" stroke="#2A2723" pathLength="100" style="animation-delay:0.75s"/>
<g class="up" style="animation-delay:0.85s"><text class="cf" x="24" y="219">8 vCPU · 32 GB de RAM · 400 GB NVMe</text></g></g>
