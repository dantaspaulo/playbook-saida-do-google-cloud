# Portainer CE atrás do Traefik.
# Subir: PORTAINER_HOST=painel.dominio.com MEU_IP=203.0.113.10 docker stack deploy -c portainer-stack.yml portainer
# O admin nasce do segredo (nada de tela inicial aberta esperando o primeiro que chegar):
#   openssl rand -base64 24 | tee /dev/tty | docker secret create portainer_admin -
# Painel exposto é alvo: a lista de IPs permitidos vem LIGADA. Troque pelo seu IP, ou ponha o painel
# atrás de um acesso com login (Cloudflare Access, por exemplo) e então tire a lista.
version: "3.8"

services:
  agent:
    image: portainer/agent:2.45.1          # a mesma versão do portainer-ce
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [agente]
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:2.45.1  # confira a versão estável do dia
    command: -H tcp://tasks.agent:9001 --tlsskipverify --admin-password-file /run/secrets/portainer_admin
    secrets: [portainer_admin]
    volumes:
      - dados:/data
    networks: [agente, publica]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.tls.certresolver=le
        - traefik.http.services.portainer.loadbalancer.server.port=9000
        - traefik.http.middlewares.so-escritorio.ipallowlist.sourcerange=${MEU_IP}/32
        - traefik.http.routers.portainer.middlewares=so-escritorio

networks:
  agente:
    driver: overlay
    attachable: true
  publica:
    external: true

volumes:
  dados:

secrets:
  portainer_admin:
    external: true
